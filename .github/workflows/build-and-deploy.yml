name: Build and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demand-planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate and package Windows application
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Static analysis
        run: pnpm lint

      - name: Build web application
        run: pnpm build:web

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName |
            ForEach-Object { "{0}  {1}" -f $_.Hash, $installer.Name } |
            Set-Content -Path release/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: demand-planning-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          release/*.exe release/*.blockmap release/SHA256SUMS.txt
          --repo $env:GITHUB_REPOSITORY
          --title "Demand Planning Hub $env:GITHUB_REF_NAME"
          --generate-notes
        
    permissions:
      contents: write
