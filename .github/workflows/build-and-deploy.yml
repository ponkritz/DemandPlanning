name: Build and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demand-planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate and package Windows application
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Static analysis
        run: pnpm lint

      - name: Verify release version
        run: node scripts/verify-version.mjs

      - name: Run unit tests
        run: pnpm test

      - name: Build web application
        run: pnpm build:web

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName |
            ForEach-Object { "{0}  {1}" -f $_.Hash, $installer.Name } |
            Set-Content -Path release/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: demand-planning-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

    # The job runs dependency code (install, lint, tests, build): it holds a read-only token (PT-02). Publishing is a
    # separate job below that only downloads the built artifact.
    permissions:
      contents: read

  # CI-10: every push to main that passes the Windows, macOS and end-to-end jobs tags its commit vX.Y.Z (the
  # package.json version) and publishes that version's GitHub release with both installers and its release-notes
  # entry; nobody tags by hand. A tag pushed by hand runs the same job. When the release already exists (the version
  # was not bumped, or the tag build that GITHUB_TOKEN tags do not start anyway) it does nothing.
  publish-tagged-release:
    name: Tag and publish versioned release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # macOS packaging is intentionally disabled for this Windows/web release stream.
    needs: [validate-and-package, end-to-end]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: versioned-release-publish
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: demand-planning-windows-${{ github.sha }}
          path: release

      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not equal the package version $tag."; exit 1
          fi
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists; nothing to publish (was the version bumped?)."; exit 0
          fi
          node scripts/release-entry.mjs "$version" > release-notes.md
          ls -la release
          gh release create "$tag" \
            release/*.exe release/*.blockmap release/SHA256SUMS.txt \
            --repo "$REPO" --target "$GITHUB_SHA" \
            --title "Demand Planning Hub $tag" --notes-file release-notes.md
          echo "::notice::Tagged $GITHUB_SHA as $tag and published its release."

  end-to-end:
    name: End-to-end tests
    # Pinned: `ubuntu-latest` moved to Ubuntu 26.04, for which Playwright 1.56 has no Chromium build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web application
        run: pnpm build:web

      - name: Run end-to-end tests
        run: pnpm test:e2e

  # macOS runners often queue for a long time, so the disk image is built only for main (and tags or manual runs),
  # not for pull requests, and is published on its own: Web and Windows never wait for it.
  package-macos:
    name: Package macOS application
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm build:web

      # No Apple Developer ID is configured, so the app is not notarised; see the download page for first-launch steps.
      - name: Package macOS disk image (Intel + Apple silicon)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dmg --universal --publish never

      - name: Record disk image checksum
        run: |
          cd release
          dmg=$(ls *.dmg | head -n 1)
          test -n "$dmg"
          shasum -a 256 "$dmg" > SHA256SUMS-mac.txt

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: demand-planning-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/SHA256SUMS-mac.txt
          if-no-files-found: error
          retention-days: 30

  publish-windows:
    name: Publish Windows installer
    if: github.ref == 'refs/heads/main'
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publisher at a time: both installers update the same latest.json.
    concurrency:
      group: desktop-latest-publish
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: demand-planning-windows-${{ github.sha }}
          path: installers

      # One rolling release with fixed file names, so the in-app download links never change. Windows and macOS are
      # published separately (macOS runners often queue); latest.json keeps a build number per platform.
      - name: Update the desktop-latest release (Windows)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la installers
          notes="Latest desktop builds from main. Windows: Demand-Planning-Hub-Setup.exe. macOS: Demand-Planning-Hub-mac.dmg. Each platform's build number is in latest.json; checksums in SHA256SUMS*.txt."
          if gh release view desktop-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release edit desktop-latest --repo "$REPO" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
            gh release download desktop-latest --repo "$REPO" --pattern latest.json --dir current || true
          else
            gh release create desktop-latest --repo "$REPO" --target "$GITHUB_SHA" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
          fi
          node scripts/desktop-manifest.cjs win32 installers/Demand-Planning-Hub-Setup.exe current/latest.json installers/latest.json
          gh release upload desktop-latest installers/Demand-Planning-Hub-Setup.exe installers/SHA256SUMS.txt installers/latest.json --repo "$REPO" --clobber

  # Disabled together with package-macos; Windows and browser builds remain independent.
  publish-macos:
    name: Publish macOS installer
    if: ${{ false }}
    needs: package-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publisher at a time: both installers update the same latest.json.
    concurrency:
      group: desktop-latest-publish
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: demand-planning-macos-${{ github.sha }}
          path: installers

      # One rolling release with fixed file names, so the in-app download links never change. Windows and macOS are
      # published separately (macOS runners often queue); latest.json keeps a build number per platform.
      - name: Update the desktop-latest release (macOS)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la installers
          notes="Latest desktop builds from main. Windows: Demand-Planning-Hub-Setup.exe. macOS: Demand-Planning-Hub-mac.dmg. Each platform's build number is in latest.json; checksums in SHA256SUMS*.txt."
          if gh release view desktop-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release edit desktop-latest --repo "$REPO" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
            gh release download desktop-latest --repo "$REPO" --pattern latest.json --dir current || true
          else
            gh release create desktop-latest --repo "$REPO" --target "$GITHUB_SHA" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
          fi
          node scripts/desktop-manifest.cjs darwin installers/Demand-Planning-Hub-mac.dmg current/latest.json installers/latest.json
          gh release upload desktop-latest installers/Demand-Planning-Hub-mac.dmg installers/SHA256SUMS-mac.txt installers/latest.json --repo "$REPO" --clobber

  build-web-site:
    name: Build browser application
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version and update safety
        run: |
          node scripts/verify-version.mjs
          pnpm test

      - name: Build browser application
        run: pnpm build:web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web-site:
    name: Deploy browser application
    if: github.ref == 'refs/heads/main'
    needs: build-web-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
