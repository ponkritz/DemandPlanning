name: Build and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run of the same pull request; a run on main is never cancelled, so every release
# commit is built, tagged and published (CI-11). A third merge while one run builds replaces only the waiting run, whose
# change notes the next release commit still includes.
concurrency:
  group: demand-planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI-11: after a merge to main, the change notes in docs/changes/ become the new version (package.json), its entry at
  # the top of docs/RELEASE-NOTES.md (with the PR numbers) and the regenerated SWBOM and traceability matrix, pushed as
  # one release commit; the jobs below build, test, tag and publish that commit. It works on the newest main (a merge
  # that landed meanwhile is included) and retries when main moves under it. It runs only this repository's own
  # scripts with Node.js and installs nothing (CI-07); a push with GITHUB_TOKEN starts no new workflow run.
  release-commit:
    name: Write release commit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-commit
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out the newest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Write and push the release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            version=$(node scripts/release-changes.mjs --apply)
            node scripts/swbom.mjs
            node scripts/traceability.mjs
            git add -A package.json docs
            if git diff --cached --quiet; then
              echo "::notice::No change notes and the generated documents are current: nothing to commit."
              break
            fi
            if [ -n "$version" ]; then message="Release v$version"; else message="Regenerate SWBOM and traceability matrix"; fi
            git commit -q -m "$message [skip ci]"
            if git -c "http.extraheader=$auth" push -q origin HEAD:main; then
              echo "::notice::Pushed $message as $(git rev-parse HEAD)."
              break
            fi
            if [ "$attempt" = 3 ]; then echo "::error::main kept moving; the next merge writes the release."; exit 1; fi
            echo "::warning::main moved; writing the release again on the newest main."
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-and-package:
    name: Validate and package Windows application
    needs: release-commit
    if: ${{ !cancelled() && needs.release-commit.result != 'failure' }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-commit.outputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Static analysis
        run: pnpm lint

      - name: Verify release version
        run: node scripts/verify-version.mjs

      # CI-09: a pull request adds its change note in docs/changes/ and leaves the version to the release commit.
      # Dependabot's pull requests (GitHub Actions updates) carry no note and make no release.
      - name: Check the change note
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then echo "Dependabot: no change note needed."; exit 0; fi
          node scripts/release-changes.mjs --pr-check "$BASE_SHA"

      - name: Run unit tests
        env:
          CHECK_GENERATED: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: pnpm test

      - name: Build web application
        run: pnpm build:web

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName |
            ForEach-Object { "{0}  {1}" -f $_.Hash, $installer.Name } |
            Set-Content -Path release/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demand-planning-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

    # The job runs dependency code (install, lint, tests, build): it holds a read-only token (PT-02). Publishing is a
    # separate job below that only downloads the built artifact.
    permissions:
      contents: read

  # CI-10: every push to main that passes the Windows, macOS and end-to-end jobs tags its release commit vX.Y.Z (the
  # package.json version) and publishes that version's GitHub release with both installers and its release-notes
  # entry; nobody tags by hand. A tag pushed by hand runs the same job. When the release already exists (the version
  # was not bumped, or the tag build that GITHUB_TOKEN tags do not start anyway) it does nothing.
  publish-tagged-release:
    name: Tag and publish versioned release
    # The release commit is skipped on a tag push; the job still needs the three builds to pass.
    if: ${{ !cancelled() && needs.release-commit.result != 'failure' && needs.validate-and-package.result == 'success' && needs.package-macos.result == 'success' && needs.end-to-end.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [release-commit, validate-and-package, package-macos, end-to-end]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: versioned-release-publish
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-commit.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demand-planning-windows-${{ github.sha }}
          path: release

      - name: Download macOS disk image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demand-planning-macos-${{ github.sha }}
          path: release

      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-commit.outputs.sha || github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not equal the package version $tag."; exit 1
          fi
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists; nothing to publish (was the version bumped?)."; exit 0
          fi
          node scripts/release-entry.mjs "$version" > release-notes.md
          ls -la release
          gh release create "$tag" \
            release/*.exe release/*.blockmap release/SHA256SUMS.txt release/*.dmg release/SHA256SUMS-mac.txt \
            --repo "$REPO" --target "$RELEASE_SHA" \
            --title "Demand Planning Hub $tag" --notes-file release-notes.md
          echo "::notice::Tagged $RELEASE_SHA as $tag and published its release."

  end-to-end:
    name: End-to-end tests
    needs: release-commit
    if: ${{ !cancelled() && needs.release-commit.result != 'failure' }}
    # Pinned: `ubuntu-latest` moved to Ubuntu 26.04, for which Playwright 1.56 has no Chromium build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-commit.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web application
        run: pnpm build:web

      - name: Run end-to-end tests
        run: pnpm test:e2e


  # CI-12: the same scenarios on a CPU four times slower (Chromium throttling), as on a busy laptop: a step that only
  # passes because the app happens to be fast (a race between rendering, focus and saving) fails here first.
  end-to-end-slow:
    name: End-to-end tests (slow machine)
    needs: release-commit
    if: ${{ !cancelled() && needs.release-commit.result != 'failure' }}
    # Pinned: `ubuntu-latest` moved to Ubuntu 26.04, for which Playwright 1.56 has no Chromium build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-commit.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web application
        run: pnpm build:web

      - name: Run end-to-end tests on a 4x slower CPU
        env:
          E2E_CPU_SLOWDOWN: '4'
        run: pnpm test:e2e
  # macOS runners often queue for a long time, so the disk image is built only for main (and tags or manual runs),
  # not for pull requests, and is published on its own: Web and Windows never wait for it.
  package-macos:
    name: Package macOS application
    needs: release-commit
    if: ${{ !cancelled() && needs.release-commit.result != 'failure' && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-commit.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm build:web

      # No Apple Developer ID is configured, so the app is not notarised; see the download page for first-launch steps.
      - name: Package macOS disk image (Intel + Apple silicon)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dmg --universal --publish never

      - name: Record disk image checksum
        run: |
          cd release
          dmg=$(ls *.dmg | head -n 1)
          test -n "$dmg"
          shasum -a 256 "$dmg" > SHA256SUMS-mac.txt

      - name: Upload macOS disk image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demand-planning-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/SHA256SUMS-mac.txt
          if-no-files-found: error
          retention-days: 30

  publish-windows:
    name: Publish Windows installer
    if: github.ref == 'refs/heads/main'
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publisher at a time: both installers update the same latest.json.
    concurrency:
      group: desktop-latest-publish
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demand-planning-windows-${{ github.sha }}
          path: installers

      # One rolling release with fixed file names, so the in-app download links never change. Windows and macOS are
      # published separately (macOS runners often queue); latest.json keeps a build number per platform.
      - name: Update the desktop-latest release (Windows)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la installers
          notes="Latest desktop builds from main. Windows: Demand-Planning-Hub-Setup.exe. macOS: Demand-Planning-Hub-mac.dmg. Each platform's build number is in latest.json; checksums in SHA256SUMS*.txt."
          if gh release view desktop-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release edit desktop-latest --repo "$REPO" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
            gh release download desktop-latest --repo "$REPO" --pattern latest.json --dir current || true
          else
            gh release create desktop-latest --repo "$REPO" --target "$GITHUB_SHA" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
          fi
          node scripts/desktop-manifest.cjs win32 installers/Demand-Planning-Hub-Setup.exe current/latest.json installers/latest.json
          gh release upload desktop-latest installers/Demand-Planning-Hub-Setup.exe installers/SHA256SUMS.txt installers/latest.json --repo "$REPO" --clobber

  publish-macos:
    name: Publish macOS installer
    if: github.ref == 'refs/heads/main'
    needs: package-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publisher at a time: both installers update the same latest.json.
    concurrency:
      group: desktop-latest-publish
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demand-planning-macos-${{ github.sha }}
          path: installers

      # One rolling release with fixed file names, so the in-app download links never change. Windows and macOS are
      # published separately (macOS runners often queue); latest.json keeps a build number per platform.
      - name: Update the desktop-latest release (macOS)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la installers
          notes="Latest desktop builds from main. Windows: Demand-Planning-Hub-Setup.exe. macOS: Demand-Planning-Hub-mac.dmg. Each platform's build number is in latest.json; checksums in SHA256SUMS*.txt."
          if gh release view desktop-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release edit desktop-latest --repo "$REPO" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
            gh release download desktop-latest --repo "$REPO" --pattern latest.json --dir current || true
          else
            gh release create desktop-latest --repo "$REPO" --target "$GITHUB_SHA" --title "Demand Planning Hub — latest desktop build" --notes "$notes" --prerelease
          fi
          node scripts/desktop-manifest.cjs darwin installers/Demand-Planning-Hub-mac.dmg current/latest.json installers/latest.json
          gh release upload desktop-latest installers/Demand-Planning-Hub-mac.dmg installers/SHA256SUMS-mac.txt installers/latest.json --repo "$REPO" --clobber

  build-web-site:
    name: Build browser application
    needs: release-commit
    if: ${{ !cancelled() && needs.release-commit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-commit.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version and update safety
        env:
          CHECK_GENERATED: '1'
        run: |
          node scripts/verify-version.mjs
          pnpm test

      - name: Build browser application
        run: pnpm build:web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy-web-site:
    name: Deploy browser application
    if: github.ref == 'refs/heads/main'
    needs: build-web-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
